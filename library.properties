sentence=Easy rotary encoder library (KY-040): clicks, value with limits, acceleration, button click and long press. Polling or interrupts, no dependencies.
paragraph=Reads a rotary encoder with a button on any pins with a short code: value(), changed(), turnedRight(), clicked(). Filters contact noise and lost pulses, supports limits with wrap-around, step, acceleration, polling or interrupt mode, and explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266 and other boards. Examples included, made for classes and kits by Alash Electronics.
